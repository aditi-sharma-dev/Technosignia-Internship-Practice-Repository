<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify OTP</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body{
            background:linear-gradient(rgba(0,0,0,.45),rgba(0,0,0,.45)),
                       url("/static/images/company.jpg");
            background-size:cover;
            background-position:center;
            min-height:100vh;
            font-family:Arial,sans-serif;
        }

        .card{
            max-width:430px;
            margin:auto;
            border:none;
            border-radius:15px;
            box-shadow:0 15px 35px rgba(0,0,0,.25);
        }

        .form-control{
            border-radius:8px;
        }

        .btn{
            border-radius:8px;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="row vh-100 justify-content-center align-items-center">

        <div class="col-lg-4 col-md-5 col-sm-8 col-11">

            <div class="card p-4">

                <h3 class="text-center fw-bold">
                    Verify OTP
                </h3>

                <p class="text-center text-muted">
                    Enter the OTP sent to your email
                </p>

                <form id="otpForm">

                    {% csrf_token %}

                    <div class="mb-3">
                        <label class="form-label">OTP</label>

                        <input
                            type="text"
                            id="otp"
                            class="form-control"
                            placeholder="Enter 6 Digit OTP"
                            maxlength="6"
                            required
                        >
                    </div>

                    <button class="btn btn-success w-100">
                        Verify OTP
                    </button>

                </form>

            </div>

        </div>

    </div>
</div>

<script>

const form=document.getElementById("otpForm");

form.addEventListener("submit",async function(e){

    e.preventDefault();

    const email=localStorage.getItem("reset_email");

    const csrftoken=document.querySelector("[name=csrfmiddlewaretoken]").value;

    const response=await fetch("/employees/verify-otp/",{

        method:"POST",

        headers:{
            "Content-Type":"application/json",
            "X-CSRFToken":csrftoken
        },

        body:JSON.stringify({

            Email:email,
            OTP:document.getElementById("otp").value

        })

    });

    const result=await response.json();

    alert(result.message);
    localStorage.setItem("reset_otp", document.getElementById("otp").value);
    if(response.ok){

    localStorage.setItem("reset_otp", document.getElementById("otp").value);

    window.location.href="/employees/reset-password-page/";

}

});

</script>

</body>
</html>
