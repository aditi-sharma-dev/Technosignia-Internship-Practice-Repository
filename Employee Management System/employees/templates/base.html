<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}Employee Management System{% endblock %}</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>

        body {
            background: #eef5fb;
            font-family: Arial, sans-serif;
        }

        .sidebar {
            background: #173d63;
            min-height: 100vh;
        }

        .sidebar .nav-link {
            color: white;
            padding: 12px 15px;
            border-radius: 12px;
            margin-bottom: 10px;
            transition: .3s;
        }

        .sidebar .nav-link:hover {
            background: #2c5f94;
        }

        .sidebar .active {
            background: #0d6efd;
        }

    </style>

    {% block extra_css %}
    {% endblock %}

</head>

<body>

<div class="container-fluid">

    <div class="row">

        <!-- ================= SIDEBAR ================= -->

        <div class="col-lg-2 col-md-4 sidebar text-white p-4">

            <h3 class="fw-bold text-center mb-4">

                <i class="bi bi-buildings-fill"></i>

                EMS

            </h3>

            <hr>

            <ul class="nav flex-column">


                <!-- DASHBOARD -->

                <li class="nav-item">

                    <a href="{% url 'dashboard' %}"
                       class="nav-link {% block dashboard_active %}{% endblock %}">

                        <i class="bi bi-speedometer2 me-2"></i>

                        Dashboard

                    </a>

                </li>


                <!-- ADD EMPLOYEE -->

                <li class="nav-item">

                    <a href="{% url 'add_employee_page' %}"
                       class="nav-link {% block add_employee_active %}{% endblock %}">

                        <i class="bi bi-person-plus-fill me-2"></i>

                        Add Employee

                    </a>

                </li>


                <!-- VIEW EMPLOYEES -->

                <li class="nav-item">

                    <a href="{% url 'view_employee_page' %}"
                       class="nav-link {% block employees_active %}{% endblock %}">

                        <i class="bi bi-people-fill me-2"></i>

                        View Employees

                    </a>

                </li>


                <!-- PROFILE
                     Dashboard page par hide rahega -->

                {% if request.resolver_match.url_name != 'dashboard' %}

                <li class="nav-item">

                    <a href="{% url 'profile_page' %}"
                       class="nav-link {% block profile_active %}{% endblock %}">

                        <i class="bi bi-person-circle me-2"></i>

                        Profile

                    </a>

                </li>

                {% endif %}


                <!-- ACTIVITY LOGS -->

                <li class="nav-item">

                    <a href="{% url 'activity_logs_page' %}"
                       class="nav-link {% block logs_active %}{% endblock %}">

                        <i class="bi bi-clock-history me-2"></i>

                        Activity Logs

                    </a>

                </li>


                <!-- LOGOUT -->

                <li class="nav-item mt-5">

                    <a href="#"
                       id="logoutBtn"
                       class="nav-link text-warning">

                        <i class="bi bi-box-arrow-right me-2"></i>

                        Logout

                    </a>

                </li>

            </ul>

        </div>


        <!-- ================= MAIN CONTENT ================= -->

        <div class="col-lg-10 col-md-8">

            {% block content %}

            {% endblock %}

        </div>

    </div>

</div>


<!-- ================= JAVASCRIPT ================= -->

<script>


/* =========================================
   CHECK LOGIN
========================================= */

async function checkLogin() {

    const token = localStorage.getItem("access");


    /* Token nahi hai */

    if (!token) {

        alert("Session Expired. Please Login Again.");

        window.location.href = "/employees/login-page/";

        return;

    }


    try {

        const response = await fetch("/employees/protected/", {

            headers: {

                "Authorization": `Bearer ${token}`

            }

        });


        /* Token invalid / expired */

        if (!response.ok) {

            localStorage.removeItem("access");

            localStorage.removeItem("refresh");

            alert("Session Expired. Please Login Again.");

            window.location.href = "/employees/login-page/";

        }

    }

    catch (error) {

        console.log(error);

    }

}


/* Login check */

checkLogin();



/* =========================================
   LOGOUT
========================================= */

const logoutBtn = document.getElementById("logoutBtn");


if (logoutBtn) {

    logoutBtn.addEventListener("click", async function(e) {

        e.preventDefault();


        try {

            const refresh = localStorage.getItem("refresh");


            const response = await fetch("/employees/logout/", {

                method: "POST",

                headers: {

                    "Content-Type": "application/json"

                },

                body: JSON.stringify({

                    refresh: refresh

                })

            });


            const result = await response.json();


            /* Remove tokens */

            localStorage.removeItem("access");

            localStorage.removeItem("refresh");

            alert(result.message || "Logout successful.");
         


            /* Go to login */

            window.location.href = "/employees/login-page/";

        }


        catch (error) {

            console.log(error);


            localStorage.removeItem("access");

            localStorage.removeItem("refresh");


            window.location.href = "/employees/login-page/";

        }

    });

}

</script>


{% block extra_js %}
{% endblock %}


</body>
</html>
