<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body{
            background: linear-gradient(rgba(0,0,0,.45), rgba(0,0,0,.45)),
                        url("/static/images/company.jpg");
            background-size: cover;
            background-position: center;
            min-height:100vh;
            font-family:Arial,sans-serif;
        }

        .card{
            max-width:430px;
            margin:auto;
            border:none;
            border-radius:15px;
            box-shadow:0 15px 35px rgba(0,0,0,.25);
        }

        .form-control{
            border-radius:8px;
        }

        .btn{
            border-radius:8px;
        }
    </style>

</head>
<body>

<div class="container">
    <div class="row vh-100 justify-content-center align-items-center">

        <div class="col-lg-4 col-md-5 col-sm-8 col-11">

            <div class="card p-4">

                <h3 class="text-center fw-bold">
                    Forgot Password
                </h3>

                <p class="text-center text-muted">
                    Enter your registered email
                </p>

                <form id="forgotForm">

                    {% csrf_token %}

                    <div class="mb-3">
                        <label class="form-label">Email</label>

                        <input type="email"
                               id="email"
                               class="form-control"
                               placeholder="Enter Email"
                               required>
                    </div>

                    <button class="btn btn-primary w-100">
                        Send OTP
                    </button>

                    <div class="text-center mt-3">
                        <a href="{% url 'login_page' %}">
                            Back to Login
                        </a>
                    </div>

                </form>

            </div>

        </div>

    </div>
</div>

<script>

const form=document.getElementById("forgotForm");

form.addEventListener("submit",async function(e){

    e.preventDefault();

    const csrftoken=document.querySelector("[name=csrfmiddlewaretoken]").value;

    const response=await fetch("/employees/forgot-password/",{

        method:"POST",

        headers:{
            "Content-Type":"application/json",
            "X-CSRFToken":csrftoken
        },

        body:JSON.stringify({

            Email:document.getElementById("email").value

        })

    });

    const result=await response.json();

    alert(result.message);

    if(response.ok){

        localStorage.setItem("reset_email",document.getElementById("email").value);

        window.location.href="/employees/verify-otp-page/";

    }

});

</script>

</body>
</html>
