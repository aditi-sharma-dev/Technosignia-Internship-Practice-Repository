{% extends "user_base.html" %}
{% load static %}

{% block title %}
Update Profile
{% endblock %}


{% block profile_active %}
active
{% endblock %}


{% block content %}

<!-- ================= HEADER ================= -->

<div class="d-flex justify-content-between align-items-center bg-white shadow-sm px-4 py-3">

    <div>

        <h2 class="fw-bold mb-0">
            Update Profile
        </h2>

        <p class="text-primary fw-semibold mb-0 mt-1">
            Employee Management System
        </p>

    </div>

</div>


<!-- ================= PROFILE CARD ================= -->

<div class="card shadow-lg p-4 mt-4">

    <!-- PROFILE PHOTO -->

    <div class="text-center mb-4">
          <img
    id="profilePhoto"
    src="{% static 'images/default.jpg' %}"
    alt="Profile Photo"
    class="rounded-circle border border-3 border-primary shadow"
    width="130"
    height="130"
    style="object-fit: cover;"
>
       

        <!-- PHOTO INPUT -->

        <div class="mt-3">

            <input
                type="file"
                id="profilePhotoInput"
                class="form-control w-50 mx-auto"
                accept="image/*"
            >

        </div>


        <!-- NAME -->

        <div class="mt-3 w-50 mx-auto">

            <label class="fw-bold mb-2">
                Full Name
            </label>

            <input
                type="text"
                id="name"
                class="form-control"
            >

        </div>


        <!-- ROLE -->

        <span
            class="badge bg-primary px-4 py-2 fs-6 mt-3"
            id="role"
        >
        </span>

    </div>


    <!-- ================= EMPLOYEE INFORMATION ================= -->

    <div class="row">

        <!-- Employee ID -->

        <div class="col-md-6 mb-3">

            <label class="fw-bold">
                Employee ID
            </label>

            <input
                type="text"
                id="Emp_Id"
                class="form-control"
                readonly
            >

        </div>


        <!-- Email -->

        <div class="col-md-6 mb-3">

            <label class="fw-bold">
                Email
            </label>

            <input
                type="email"
                id="email"
                class="form-control"
            >

        </div>


        <!-- Phone -->

        <div class="col-md-6 mb-3">

            <label class="fw-bold">
                Phone
            </label>

            <input
                type="text"
                id="phone"
                class="form-control"
            >

        </div>


        <!-- City -->

        <div class="col-md-6 mb-3">

            <label class="fw-bold">
                City
            </label>

            <input
                type="text"
                id="city"
                class="form-control"
            >

        </div>


        <!-- Address -->

        <div class="col-md-6 mb-3">

            <label class="fw-bold">
                Address
            </label>

            <textarea
                id="address"
                rows="2"
                class="form-control"
            ></textarea>

        </div>


        <!-- Department -->

        <div class="col-md-6 mb-3">

            <label class="fw-bold">
                Department
            </label>

            <input
                type="text"
                id="department"
                class="form-control"
                readonly
            >

        </div>


        <!-- Designation -->

        <div class="col-md-6 mb-3">

            <label class="fw-bold">
                Designation
            </label>

            <input
                type="text"
                id="designation"
                class="form-control"
                readonly
            >

        </div>


        <!-- Salary -->

        <div class="col-md-6 mb-3">

            <label class="fw-bold">
                Salary
            </label>

            <input
                type="text"
                id="salary"
                class="form-control"
                readonly
            >

        </div>


        <!-- Status -->

        <div class="col-md-6 mb-3">

            <label class="fw-bold">
                Status
            </label>

            <input
                type="text"
                id="status"
                class="form-control"
                readonly
            >

        </div>

    </div>


    <!-- ================= BUTTONS ================= -->

    <div class="text-center mt-4">

        <button
            class="btn btn-success px-4"
            onclick="updateProfile()"
        >

            <i class="bi bi-check-circle me-2"></i>

            Update Profile

        </button>


        <a
            href="{% url 'user_profile_page' %}"
            class="btn btn-secondary px-4 ms-2"
        >

            Cancel

        </a>

    </div>

</div>

{% endblock %}



{% block extra_js %}

<script>


/* ==========================================
   LOAD PROFILE
========================================== */

async function loadProfile() {

    const token =
        localStorage.getItem("access");


    if (!token) {

        alert(
            "Session Expired. Please Login Again."
        );

        window.location.href =
            "/employees/login-page/";

        return;

    }


    try {

        const response = await fetch(
            "/employees/profile/",
            {
                method: "GET",

                headers: {
                    "Authorization":
                        `Bearer ${token}`
                }
            }
        );


        if (!response.ok) {

            throw new Error(
                "Failed to load profile"
            );

        }


        const data =
            await response.json();


        /* Profile Photo */
        const profilePhoto = document.getElementById("profilePhoto");

const defaultPhoto = "{% static 'images/default.jpg' %}";

if (data.Profile_Photo && data.Profile_Photo.trim() !== "") {
    profilePhoto.src = data.Profile_Photo;
} else {
    profilePhoto.src = defaultPhoto;
}
        



        /* Basic Information */

        document.getElementById(
            "name"
        ).value =
            data.Name || "";


        document.getElementById(
            "role"
        ).innerText =
            data.Role || "";


        document.getElementById(
            "Emp_Id"
        ).value =
            data.Emp_Id || "";


        document.getElementById(
            "email"
        ).value =
            data.Email || "";


        document.getElementById(
            "phone"
        ).value =
            data.Phone_No || "";


        document.getElementById(
            "city"
        ).value =
            data.City || "";


        document.getElementById(
            "department"
        ).value =
            data.Department || "";


        document.getElementById(
            "designation"
        ).value =
            data.Designation || "";


        document.getElementById(
            "salary"
        ).value =
            data.Salary || "";


        document.getElementById(
            "status"
        ).value =
            data.Status || "";


        document.getElementById(
            "address"
        ).value =
            data.Address || "";

    }


    catch(error) {

        console.error(error);

        alert(
            "Failed to load profile."
        );

    }

}



/* ==========================================
   PROFILE PHOTO PREVIEW
========================================== */

document
    .getElementById("profilePhotoInput")
    .addEventListener(
        "change",
        function() {

            const file =
                this.files[0];


            if (file) {

                document.getElementById(
                    "profilePhoto"
                ).src =
                    URL.createObjectURL(file);

            }

        }
    );



/* ==========================================
   UPDATE PROFILE
========================================== */

async function updateProfile() {

    const token =
        localStorage.getItem("access");


    if (!token) {

        alert(
            "Session Expired. Please Login Again."
        );

        window.location.href =
            "/employees/login-page/";

        return;

    }


    const formData =
        new FormData();


    formData.append(
        "Name",
        document.getElementById("name").value.trim()
    );


    formData.append(
        "Email",
        document.getElementById("email").value.trim()
    );


    formData.append(
        "Phone_No",
        document.getElementById("phone").value.trim()
    );


    formData.append(
        "City",
        document.getElementById("city").value.trim()
    );


    formData.append(
        "Address",
        document.getElementById("address").value.trim()
    );


    const photo =
        document.getElementById(
            "profilePhotoInput"
        ).files[0];


    if (photo) {

        formData.append(
            "Profile_Photo",
            photo
        );

    }


    try {

        const response =
            await fetch(
                "/employees/user-update-profile/",
                {
                    method: "PUT",

                    headers: {
                        "Authorization":
                            `Bearer ${token}`
                    },

                    body: formData
                }
            );


        const data =
            await response.json();


        console.log(data);


        if (!response.ok) {

            alert(
                data.message ||
                JSON.stringify(data)
            );

            return;

        }


        alert(
            "Profile Updated Successfully"
        );


        window.location.href =
            "{% url 'user_profile_page' %}";

    }


    catch(error) {

        console.error(error);

        alert(
            "Something went wrong while updating profile."
        );

    }

}



/* ==========================================
   INITIAL LOAD
========================================== */

loadProfile();

</script>

{% endblock %}
