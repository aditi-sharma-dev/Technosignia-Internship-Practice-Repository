<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body{
            background:linear-gradient(rgba(0,0,0,.45),rgba(0,0,0,.45)),
                       url("/static/images/company.jpg");
            background-size:cover;
            background-position:center;
            min-height:100vh;
            font-family:Arial,sans-serif;
        }

        .card{
            max-width:430px;
            margin:auto;
            border:none;
            border-radius:15px;
            box-shadow:0 15px 35px rgba(0,0,0,.25);
        }

        .form-control{
            border-radius:8px;
        }

        .btn{
            border-radius:8px;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="row vh-100 justify-content-center align-items-center">

        <div class="col-lg-4 col-md-5 col-sm-8 col-11">

            <div class="card p-4">

                <h3 class="text-center fw-bold">
                    Reset Password
                </h3>

                <p class="text-center text-muted">
                    Enter your new password
                </p>

                <form id="resetForm">

                    {% csrf_token %}

                    <div class="mb-3">
                        <label class="form-label">New Password</label>
                        <input
                            type="password"
                            id="new_password"
                            class="form-control"
                            required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Confirm Password</label>
                        <input
                            type="password"
                            id="confirm_password"
                            class="form-control"
                            required>
                    </div>

                    <button class="btn btn-primary w-100">
                        Reset Password
                    </button>

                </form>

            </div>

        </div>

    </div>
</div>

<script>

const form = document.getElementById("resetForm");

form.addEventListener("submit", async function(e){

    e.preventDefault();

    const email = localStorage.getItem("reset_email");
    const otp = localStorage.getItem("reset_otp");

    const csrftoken = document.querySelector("[name=csrfmiddlewaretoken]").value;

    const response = await fetch("/employees/reset-password/",{

        method:"POST",

        headers:{
            "Content-Type":"application/json",
            "X-CSRFToken":csrftoken
        },

     
             body: JSON.stringify({
                 Email: email,
                 OTP: otp,
                 new_password: document.getElementById("new_password").value,
                 confirm_password: document.getElementById("confirm_password").value
})
               
    });

    const result = await response.json();

    alert(result.message);
    
    if(response.ok){

        localStorage.removeItem("reset_email");
        localStorage.removeItem("reset_otp");

        window.location.href="/employees/login-page/";

    }

});

</script>

</body>
</html>
