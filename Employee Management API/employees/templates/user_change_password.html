{% extends "user_base.html" %}
{% load static %}


{% block title %}
Change Password
{% endblock %}


{% block profile_active %}
active
{% endblock %}


{% block content %}

<!-- ================= HEADER ================= -->

<div class="d-flex justify-content-between align-items-center bg-white shadow-sm px-4 py-3">

    <div>

        <h2 class="fw-bold mb-0">
            Change Password
        </h2>

        <p class="text-primary fw-semibold mb-0 mt-1">
            Employee Management System
        </p>

    </div>

</div>


<!-- ================= CHANGE PASSWORD CARD ================= -->

<div class="card shadow p-4 mt-4">

    <div class="mb-3">

        <label class="form-label fw-semibold">
            Old Password
        </label>

        <input
            type="password"
            id="old_password"
            class="form-control"
            placeholder="Enter old password"
        >

    </div>


    <div class="mb-3">

        <label class="form-label fw-semibold">
            New Password
        </label>

        <input
            type="password"
            id="new_password"
            class="form-control"
            placeholder="Enter new password"
        >

    </div>


    <div class="mb-3">

        <label class="form-label fw-semibold">
            Confirm Password
        </label>

        <input
            type="password"
            id="confirm_password"
            class="form-control"
            placeholder="Confirm new password"
        >

    </div>


    <!-- BUTTONS -->

    <div class="text-center mt-3">

        <button
            class="btn btn-primary px-4"
            onclick="changePassword()"
        >

            <i class="bi bi-key-fill me-2"></i>

            Change Password

        </button>


        <a
            href="{% url 'user_profile_page' %}"
            class="btn btn-secondary px-4 ms-2"
        >

            Cancel

        </a>

    </div>

</div>

{% endblock %}



{% block extra_js %}

<script>


/* ==========================================
   CHANGE PASSWORD
========================================== */

async function changePassword() {

    const token =
        localStorage.getItem("access");


    /* TOKEN CHECK */

    if (!token) {

        alert(
            "Session Expired. Please Login Again."
        );

        window.location.href =
            "/employees/login-page/";

        return;

    }


    /* GET VALUES */

    const oldPassword =
        document
            .getElementById("old_password")
            .value
            .trim();


    const newPassword =
        document
            .getElementById("new_password")
            .value
            .trim();


    const confirmPassword =
        document
            .getElementById("confirm_password")
            .value
            .trim();



    /* BASIC VALIDATION */

    if (!oldPassword) {

        alert(
            "Please enter your old password."
        );

        return;

    }


    if (!newPassword) {

        alert(
            "Please enter your new password."
        );

        return;

    }


    if (!confirmPassword) {

        alert(
            "Please confirm your new password."
        );

        return;

    }


    if (newPassword !== confirmPassword) {

        alert(
            "New password and confirm password do not match."
        );

        return;

    }


    if (oldPassword === newPassword) {

        alert(
            "New password must be different from old password."
        );

        return;

    }



    /* API CALL */

    try {

        const response =
            await fetch(
                "/employees/change-password/",
                {

                    method: "PUT",

                    headers: {

                        "Content-Type":
                            "application/json",

                        "Authorization":
                            `Bearer ${token}`

                    },

                    body: JSON.stringify({

                        old_password:
                            oldPassword,

                        new_password:
                            newPassword,

                        confirm_password:
                            confirmPassword

                    })

                }
            );


        const data =
            await response.json();


        console.log(data);



        /* ERROR */

        if (!response.ok) {

            alert(
                data.message ||
                "Unable to change password."
            );

            return;

        }



        /* SUCCESS */

        alert(
            data.message ||
            "Password changed successfully."
        );


        /* CLEAR INPUTS */

        document.getElementById(
            "old_password"
        ).value = "";


        document.getElementById(
            "new_password"
        ).value = "";


        document.getElementById(
            "confirm_password"
        ).value = "";



        /* REDIRECT */

        window.location.href =
            "{% url 'user_profile_page' %}";

    }


    catch(error) {

        console.error(error);

        alert(
            "Something went wrong while changing password."
        );

    }

}

</script>

{% endblock %}
