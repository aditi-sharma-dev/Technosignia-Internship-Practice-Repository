<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>View Employees</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

<style>
    body{
    background: linear-gradient(135deg,#e3f2fd,#f8f9fa);
    min-height:100vh;
    font-family:Arial,sans-serif;
    }


 
.sidebar{
    background:#173d63;
    min-height:100vh;
}

.sidebar .nav-link{
    color:white;
    padding:12px 15px;
    border-radius:12px;
    margin-bottom:10px;
}

.sidebar .nav-link:hover{
    background:#2c5f94;
}

.sidebar .active{
    background:#0d6efd;
}

.title{

    color:#0d6efd;
    font-weight:700;

    }


   .subtitle{

     color:#555;

   }
   .search-box{
    background:#f8f9fa;
    padding:20px;
    border-radius:15px;
    margin-bottom:25px;
    border:1px solid #dee2e6;
     }

   .search-box .form-control,
   .search-box .form-select{
    height:45px;
    border-radius:10px;
    }

   .search-box .btn{
    height:45px;
    border-radius:10px;
    font-weight:600;
   }

   .input-group-text{
    border-radius:10px 0 0 10px;
   }

   .form-control{
    border-radius:0 10px 10px 0;
   }
   .sort-area{

    margin-bottom:20px;
   }
   .table-responsive{
    border-radius:15px;
    overflow-x:auto;
    overflow-y:hidden;
    
}
   
   .table{

    margin-bottom:0;
    font-size:13px;
   }

   .table th{

    text-align:center;
    vertical-align:middle;
    white-space:nowrap;
    }
    .table-header {
    background-color: #0d6efd;
    color: white;
}

   .table-header th {
    background-color: #0d6efd !important;
    color: white;
    text-align: center;
    vertical-align: middle;
   }
   .table td{

    text-align:center;
    vertical-align:middle;
    }
    .table tbody tr:hover{

    background:#f1f7ff;
    transition:0.3s;
   }

  .action-btn{

    padding:4px 10px;
    font-size:13px;
    border-radius:7px;
    }


    .back-link{

    text-decoration:none;
    font-weight:600;
}
</style>

</head>


<body>
    <div class="container-fluid">
        <div class="row">
            <div class="col-lg-2 col-md-4 sidebar text-white p-4">
                <h3 class="fw-bold text-center mb-4">
                    <i class="bi bi-buildings-fill"></i>
                    EMS
                </h3>
                <hr>
                <ul class="nav flex-column">
                    <li class="nav-item">
                       <a href="{% url 'dashboard' %}" class="nav-link">
                          <i class="bi bi-speedometer2 me-2"></i>
                          Dashboard
                       </a>

                    </li>
                    <li class="nav-item">
                        <a href="{% url 'add_employee_page' %}" class="nav-link">
                            <i class="bi bi-person-plus-fill me-2"></i>
                            Add Employee
                        </a>
                    </li>
                    <li class="nav-item">
                        <a href="{% url 'view_employee_page' %}" class="nav-link active">
                            <i class="bi bi-people-fill me-2"></i>
              View Employees</a>
                    </li>
                    <li class="nav-item">
                        <a href="{% url 'profile_page' %}" class="nav-link ">
                       <i class="bi bi-people-fill me-2"></i>
                        Profile
                    </a>
                    </li>
                    <li class="nav-item mt-5">
                        <a href="#" id="logoutBtn" class="nav-link text-warning">
                            <i class="bi bi-box-arrow-right me-2"></i>
                            Logout
                        </a>
                    </li>
                </ul>
            </div>
            <div class="col-lg-10 col-md-8">
                <div class="d-flex justify-content-between align-items-center bg-white shadow-sm px-4 py-3">
              <div>
             <h2 class="fw-bold mb-0">View 
                Employees
             </h2>
              <p class="text-primary fw-semibold mb-0 mt-1">
                  Employee Management System
             </p>
           </div>
             </div>

         <div class="container-fluid mt-4">
                <div class="main-card">

        <div class="search-box">
            <div class="row g-3 align-items-center">
                <div class="col-lg-5">
                    <div class="input-group">
                        <span class="input-group-text bg-primary text-white">
                            <i class="bi bi-search"></i>
                        </span>
                        <input type="text" id="searchInput" class="form-control" placeholder="Search by Name, Email, Department or City">
                    </div>
               </div>

      
           <div class="col-lg-2">
              <select class="form-select" id="statusFilter" onchange="filterStatus()">
                <option value="">All Status</option>
                <option value="Active">Active</option>
                <option value="Inactive">Inactive</option>
              </select>
            </div>

       
           <div class="col-lg-2">
             <select class="form-select" id="sortSelect" onchange="sortEmployee()">
                <option value="">Sort By</option>
                <option value="asc">Ascending</option>
                <option value="desc">Descending</option>
             </select>
            </div>

           <div class="col-lg-1 d-grid">
             <button class="btn btn-primary" onclick="searchEmployee()">
                Search
              </button>
            </div>

       
           <div class="col-lg-2 d-grid">
              <button class="btn btn-outline-secondary" onclick="loadEmployees(1)">
                Reset
              </button>
           </div>

        </div>

     </div>
    <div class="table-responsive">
        <table class="table table-bordered table-hover text-nowrap">
            <thead class="table-header">
                <tr>
                    <th>Emp ID</th>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Phone Number</th>
                    <th>City</th>
                    <th>Address</th>
                    <th>Department</th>
                    <th>Designation</th>
                    <th>Status</th>
                    <th>Salary</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody id="employeeTable">

            </tbody>
       </table>
          </div>
</div>

<nav class="mt-4 text-center">

<button id="prevBtn" class="btn btn-outline-primary"
onclick="loadEmployees(currentPage-1)">
Previous
</button>

<span id="pageNo" class="mx-3 fw-bold"></span>

<button id="nextBtn" class="btn btn-outline-primary"
onclick="loadEmployees(currentPage+1)">
Next
</button>

</nav>

    <p class="text-center mt-3 mb-0">
    <a href="/employees/dashboard/" class="back-link">
        ← Back to Dashboard
    </a>
   </p> 


    </div>
    <form style="display:none;">
        {% csrf_token %}
    </form>
</div>
</div>



<script>
    async function filterStatus(){
    const status=document.getElementById("statusFilter").value;

    const token = localStorage.getItem("access");

    let response = await fetch(`/employees/filter-status/?status=${status}`, {
    headers: {
        "Authorization": `Bearer ${token}`
    }
});
    
    let employees=await response.json();

    displayEmployees(employees);
}
let currentPage = 1;

async function loadEmployees(page = 1){

    currentPage = page;

    const token = localStorage.getItem("access");

    const response = await fetch(`/employees/pagination/?page=${page}`,{
        headers:{
            "Authorization":`Bearer ${token}`
        }
    });

    const data = await response.json();

    displayEmployees(data.results);

    const totalPages = Math.ceil(data.count / 8);

    document.getElementById("pageNo").innerText =
    `Page ${currentPage} of ${totalPages}`;

    document.getElementById("prevBtn").disabled = !data.previous;
    document.getElementById("nextBtn").disabled = !data.next;
}

loadEmployees();

function editEmployee(id){
   window.location.href=`/employees/update_employee_page/${id}/`;
}
async function deleteEmployee(id){
    if(!confirm("Are you sure you want to delete this employee?")){
        return;
    }

    try{
        const csrftoken = document.querySelector("[name=csrfmiddlewaretoken]").value;
        const token = localStorage.getItem("access");

        const response = await fetch(`/employees/delete/${id}/`, {
            method: "DELETE",
            headers: {
                "Authorization": `Bearer ${token}`,
                "X-CSRFToken": csrftoken
            }
        });

        const result = await response.json();

        if(response.ok){
            alert("Employee Deleted Successfully");
            loadEmployees();
        }else{
            alert(result.message);
        }

    }catch(error){
        console.log(error);
        alert("Something went wrong");
    }
}

async function searchEmployee(){
    const keyword=document.getElementById("searchInput").value.trim();
    if (keyword===""){
        loadEmployees();
        return;
    }
    try{
        const token = localStorage.getItem("access");
        let response = await fetch(`/employees/search-name/?name=${keyword}`, {
        headers: {
        "Authorization": `Bearer ${token}`
    }
    });
       
       let employees=await response.json();
      if (employees.length===0){
        const token = localStorage.getItem("access");
        let response = await fetch(`/employees/search-email/?email=${keyword}`, {
         headers: {
        "Authorization": `Bearer ${token}`
    }
   });
        employees=await response.json();
      }
      if (employees.length===0){
        const token = localStorage.getItem("access");
        let response = await fetch(`/employees/search-department/?department=${keyword}`, {
         headers: {
        "Authorization": `Bearer ${token}`
        }
       });
       
        employees=await response.json();
      }
      if (employees.length===0){
       const token = localStorage.getItem("access");
        let response = await fetch(`/employees/search-city/?city=${keyword}`, {
         headers: {
        "Authorization": `Bearer ${token}`
    }
   });
        employees=await response.json();
      }
      const table=document.getElementById("employeeTable");
      table.innerHTML="";
        if (employees.length===0){
        table.innerHTML=`
        <tr>
        <td colspan="11" class="text-center text-danger">
          No Employee Found
        </td>
        </tr>
        `;
        return;
      }
      employees.forEach(employee=>{
        table.innerHTML+=`
        <tr>
        <td>${employee.Emp_Id}</td>
         <td>${employee.Name}</td>
        <td>${employee.Email}</td>
        <td>${employee.Phone_No}</td>
        <td>${employee.City}</td>
        <td>${employee.Address}</td>
        <td>${employee.Department}</td>
        <td>${employee.Designation}</td>
        <td>
        <span class="badge ${employee.Status === 'Active' ? 'bg-success' : 'bg-danger'}">
        ${employee.Status}
        </span>
        </td>
        <td>${employee.Salary}</td>
        <td>
          <button class="btn btn-outline-primary btn-sm me-1"
               onclick="editEmployee(${employee.Emp_Id})"><i class="bi bi-pencil-square me-1"></i>Edit
               </button>
              <button class="btn btn-outline-danger btn-sm"
              onclick="deleteEmployee(${employee.Emp_Id})">
              <i class="bi bi-trash me-1"></i>Delete
              </button>

        </td>
    </tr>
    `;
      });
    }catch(error){
        console.log(error);
        alert("Unable to search employee");
    }
    
}
function displayEmployees(employees) {

    const table = document.getElementById("employeeTable");
    table.innerHTML = "";

    if (employees.length === 0) {
        table.innerHTML = `
        <tr>
            <td colspan="11" class="text-center text-danger">
                No Employee Found
            </td>
        </tr>
        `;
        return;
    }

    employees.forEach(employee => {
        table.innerHTML += `
        <tr>
            <td>${employee.Emp_Id}</td>
            <td>${employee.Name}</td>
            <td>${employee.Email}</td>
            <td>${employee.Phone_No}</td>
            <td>${employee.City}</td>
            <td>${employee.Address}</td>
            <td>${employee.Department}</td>
            <td>${employee.Designation}</td>
            <td>
            <span class="badge ${employee.Status === 'Active' ? 'bg-success' : 'bg-danger'}">
            ${employee.Status}
            </span>
            </td>
            <td>${employee.Salary}</td>
            <td>
              <button class="btn btn-outline-primary btn-sm me-1"
               onclick="editEmployee(${employee.Emp_Id})"><i class="bi bi-pencil-square me-1"></i>Edit
               </button>
              <button class="btn btn-outline-danger btn-sm"
              onclick="deleteEmployee(${employee.Emp_Id})">
              <i class="bi bi-trash me-1"></i>Delete
              </button>
                
            </td>
        </tr>
        `;
    });

}
function sortEmployee(){

    const value=document.getElementById("sortSelect").value;

    if(value==="asc"){
        sortAscending();
    }
    else if(value==="desc"){
        sortDescending();
    }
    else{
        loadEmployees();
    }
}
async function sortAscending(){
    try{
        const token = localStorage.getItem("access");
        const response = await fetch("/employees/sort-ascending/", {
         headers: {
        "Authorization": `Bearer ${token}`
     }
     });
       
        const employees=await response.json();
        displayEmployees(employees)
    }catch(error){
        console.log(error)
        alert("Unable to sort employees")
    }
}
async function sortDescending(){
    try{
       const token = localStorage.getItem("access");
       const response = await fetch("/employees/sort-descending/", {
        headers: {
        "Authorization": `Bearer ${token}`
    }
});
        const employees=await response.json();
        displayEmployees(employees)
    }catch(error){
        console.log(error)
        alert("Unable to sort employees")
    }
}

</script>
</body>
</html>
