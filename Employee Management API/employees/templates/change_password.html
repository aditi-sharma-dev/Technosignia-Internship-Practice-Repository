<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
      <style>
      body{
       background:#eef5fb;
       font-family:Arial,sans-serif;
     }

   .sidebar{
       background:#173d63;
       min-height:100vh;
     }

    .sidebar .nav-link{
       color:white;
       padding:12px 15px;
       border-radius:12px;
       margin-bottom:10px;
       transition:.3s;
     }

   .sidebar .nav-link:hover{
      background:#2c5f94;
     }

   .sidebar .active{
      background:#0d6efd;
    }
    .card{
    border: none;
    border-radius: 20px;
}
</style>
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <div class="col-lg-2 col-md-4 sidebar text-white p-4">
                <h3 class="fw-bold text-center mb-4">
                    <i class="bi bi-buildings-fill"></i>
                    EMS
                </h3>
                <hr>
                <ul class="nav flex-column">
                    <li class="nav-item">
                        <a href="{% url 'dashboard' %}" class="nav-link ">
                            <i class="bi bi-speedometer2 me-2"></i>
                            Dashboard
                        </a>

                    </li>
                    <li class="nav-item">
                        <a href="{% url 'add_employee_page' %}" class="nav-link">
                            <i class="bi bi-person-plus-fill me-2"></i>
                            Add Employee
                        </a>
                    </li>
                    <li class="nav-item">
                        <a href="{% url 'view_employee_page' %}" class="nav-link">
                            <i class="bi bi-people-fill me-2"></i>
                            View Employees
                        </a>
                    </li>
                    
                    <li class="nav-item">
                        <a href="{% url 'profile_page' %}" class="nav-link active">
                       <i class="bi bi-person-circle me-2"></i>
                        Profile
                    </a>
                    </li>
                       
                    <li class="nav-item mt-5">
                        <a href="#" id="logoutBtn" class="nav-link text-warning">
                            <i class="bi bi-box-arrow-right me-2"></i>
                            Logout
                        </a>
                    </li>
                </ul>
            </div>
    <div class="col-lg-10 col-md-8">
        
        <div class="d-flex justify-content-between align-items-center  bg-white shadow-sm px-4 py-3">
            <div>
                <h2 class="fw-bold mb-0">Change Password</h2>
                <p class="text-primary fw-semibold mb-0 mt-1">Employee Management System</p>
            </div>
        </div>
       
           <div class="card shadow p-4 mt-4">
 

    <div class="mb-3">
        <label class="form-label">Old Password</label>
        <input type="password" id="old_password" class="form-control">
    </div>

    <div class="mb-3">
        <label class="form-label">New Password</label>
        <input type="password" id="new_password" class="form-control">
    </div>

    <div class="mb-3">
        <label class="form-label">Confirm Password</label>
        <input type="password" id="confirm_password" class="form-control">
    </div>

    <div class="text-center">
        <button class="btn btn-primary" onclick="changePassword()">
            Change Password
        </button>
    </div>
</div>
</div>   
</div>   
</div>   
 </div> 


    <script>

function changePassword(){

    const token = localStorage.getItem("access");

    fetch("/employees/change-password/",{

        method:"PUT",

        headers:{
            "Content-Type":"application/json",
            Authorization:`Bearer ${token}`
        },

        body:JSON.stringify({

            old_password:document.getElementById("old_password").value,
            new_password:document.getElementById("new_password").value,
            confirm_password:document.getElementById("confirm_password").value

        })

    })

    .then(async response => {

        const data = await response.json();

        if(!response.ok){
            alert(data.message);
            
            return;
        }

        alert(data.message);
         window.location.href = "/employees/profile/";

        document.getElementById("old_password").value="";
        document.getElementById("new_password").value="";
        document.getElementById("confirm_password").value="";

    })

    .catch(error=>{
        console.log(error);
        alert("Something went wrong");
    });

}
</script>
      
   
</body>
</html>
