{% extends "base.html" %}


{% block title %}
Change Password
{% endblock %}


{% block profile_active %}
active
{% endblock %}


{% block extra_css %}

<style>

.card {
    border: none;
    border-radius: 20px;
}

</style>

{% endblock %}



{% block content %}

<!-- ================= HEADER ================= -->

<div class="d-flex justify-content-between align-items-center bg-white shadow-sm px-4 py-3">

    <div>

        <h2 class="fw-bold mb-0">
            Change Password
        </h2>

        <p class="text-primary fw-semibold mb-0 mt-1">
            Employee Management System
        </p>

    </div>

</div>



<!-- ================= CHANGE PASSWORD CARD ================= -->

<div class="card shadow p-4 mt-4">

    <!-- OLD PASSWORD -->

    <div class="mb-3">

        <label class="form-label fw-bold">
            Old Password
        </label>

        <input
            type="password"
            id="old_password"
            class="form-control"
            placeholder="Enter old password"
        >

    </div>



    <!-- NEW PASSWORD -->

    <div class="mb-3">

        <label class="form-label fw-bold">
            New Password
        </label>

        <input
            type="password"
            id="new_password"
            class="form-control"
            placeholder="Enter new password"
        >

    </div>



    <!-- CONFIRM PASSWORD -->

    <div class="mb-3">

        <label class="form-label fw-bold">
            Confirm Password
        </label>

        <input
            type="password"
            id="confirm_password"
            class="form-control"
            placeholder="Confirm new password"
        >

    </div>



    <!-- BUTTONS -->

    <div class="text-center mt-3">

        <button
            class="btn btn-primary px-4"
            onclick="changePassword()"
        >

            <i class="bi bi-key-fill me-2"></i>

            Change Password

        </button>


        <a
            href="{% url 'profile_page' %}"
            class="btn btn-secondary px-4 ms-2"
        >

            Cancel

        </a>

    </div>

</div>

{% endblock %}



{% block extra_js %}

<script>

function changePassword() {

    const token =
        localStorage.getItem("access");


    if (!token) {

        alert(
            "Session Expired. Please Login Again."
        );

        window.location.href =
            "/employees/login-page/";

        return;

    }


    const oldPassword =
        document.getElementById(
            "old_password"
        ).value.trim();


    const newPassword =
        document.getElementById(
            "new_password"
        ).value.trim();


    const confirmPassword =
        document.getElementById(
            "confirm_password"
        ).value.trim();



    /* ================= VALIDATION ================= */

    if (
        !oldPassword ||
        !newPassword ||
        !confirmPassword
    ) {

        alert(
            "Please fill all password fields."
        );

        return;

    }


    if (newPassword !== confirmPassword) {

        alert(
            "New password and confirm password do not match."
        );

        return;

    }



    /* ================= API CALL ================= */

    fetch(
        "/employees/change-password/",
        {

            method: "PUT",

            headers: {

                "Content-Type":
                    "application/json",

                "Authorization":
                    `Bearer ${token}`

            },

            body: JSON.stringify({

                old_password:
                    oldPassword,

                new_password:
                    newPassword,

                confirm_password:
                    confirmPassword

            })

        }
    )


    .then(async response => {

        const data =
            await response.json();


        if (!response.ok) {

            alert(
                data.message ||
                "Unable to change password."
            );

            return;

        }


        alert(
            data.message ||
            "Password changed successfully."
        );


        /* Clear fields */

        document.getElementById(
            "old_password"
        ).value = "";


        document.getElementById(
            "new_password"
        ).value = "";


        document.getElementById(
            "confirm_password"
        ).value = "";


        /* Go to profile */

        window.location.href =
            "{% url 'profile_page' %}";

    })


    .catch(error => {

        console.error(error);

        alert(
            "Something went wrong while changing password."
        );

    });

}

</script>

{% endblock %}
