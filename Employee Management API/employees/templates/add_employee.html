{% extends "base.html" %}

{% block title %}
Add Employee
{% endblock %}


{% block add_employee_active %}
active
{% endblock %}


{% block extra_css %}

<style>

    body {
        background: linear-gradient(135deg, #e3f2fd, #f8f9fa);
    }

    .employee-card {
        border: none;
        border-radius: 20px;
        margin-top: 20px;
    }

    textarea {
        resize: none;
    }

</style>

{% endblock %}



{% block content %}

<!-- PAGE HEADER -->

<div class="d-flex justify-content-between align-items-center bg-white shadow-sm px-4 py-3">

    <div>

        <h2 class="fw-bold mb-0">
            Add Employee
        </h2>

        <p class="text-primary fw-semibold mb-0 mt-1">
            Employee Management System
        </p>

    </div>

</div>


<!-- ADD EMPLOYEE FORM -->

<div class="card employee-card shadow-lg p-4 mt-4">

    <form id="AddEmployeeForm">

        {% csrf_token %}

        <div class="row">

            <!-- Employee ID -->

            <div class="col-md-6 mb-3">

                <label class="form-label fw-semibold">
                    Employee ID
                </label>

                <input type="number"
                       class="form-control"
                       name="Emp_Id"
                       placeholder="Enter Employee ID"
                       required>

            </div>


            <!-- Name -->

            <div class="col-md-6 mb-3">

                <label class="form-label fw-semibold">
                    Name
                </label>

                <input type="text"
                       class="form-control"
                       name="Name"
                       placeholder="Enter employee name"
                       required>

            </div>


            <!-- Email -->

            <div class="col-md-6 mb-3">

                <label class="form-label fw-semibold">
                    Email
                </label>

                <input type="email"
                       class="form-control"
                       name="Email"
                       placeholder="Enter email address"
                       required>

            </div>


            <!-- Phone -->

            <div class="col-md-6 mb-3">

                <label class="form-label fw-semibold">
                    Phone Number
                </label>

                <input type="text"
                       class="form-control"
                       name="Phone_No"
                       placeholder="Enter phone number"
                       required>

            </div>


            <!-- City -->

            <div class="col-md-6 mb-3">

                <label class="form-label fw-semibold">
                    City
                </label>

                <input type="text"
                       class="form-control"
                       name="City"
                       placeholder="Enter city"
                       required>

            </div>


            <!-- Address -->

            <div class="col-md-6 mb-3">

                <label class="form-label fw-semibold">
                    Address
                </label>

                <textarea class="form-control"
                          rows="2"
                          name="Address"
                          placeholder="Enter address"
                          required></textarea>

            </div>


            <!-- Department -->

            <div class="col-md-6 mb-3">

                <label class="form-label fw-semibold">
                    Department
                </label>

                <input type="text"
                       class="form-control"
                       name="Department"
                       placeholder="Enter department"
                       required>

            </div>


            <!-- Designation -->

            <div class="col-md-6 mb-3">

                <label class="form-label fw-semibold">
                    Designation
                </label>

                <input type="text"
                       class="form-control"
                       name="Designation"
                       placeholder="Enter designation"
                       required>

            </div>


            <!-- Salary -->

            <div class="col-md-6 mb-3">

                <label class="form-label fw-semibold">
                    Salary
                </label>

                <input type="number"
                       class="form-control"
                       name="Salary"
                       placeholder="Enter salary"
                       required>

            </div>
            <!-- Status -->

<div class="col-md-6 mb-3">

    <label class="form-label fw-semibold">
        Status
    </label>

    <select
        class="form-select"
        name="Status"
        required
    >

        <option value="Active" selected>
            Active
        </option>

        <option value="Inactive">
            Inactive
        </option>

    </select>

</div>


            <!-- Password -->

            <div class="col-md-6 mb-3">

                <label class="form-label fw-semibold">
                    Password
                </label>

                <input type="password"
                       class="form-control"
                       name="Password"
                       placeholder="Enter Password"
                       required>

            </div>

        </div>


        <!-- SUBMIT BUTTON -->

        <button type="submit"
                class="btn btn-primary w-100 py-2">

            Add Employee

        </button>

    </form>

</div>

{% endblock %}



{% block extra_js %}

<script>

const form = document.getElementById("AddEmployeeForm");


form.addEventListener("submit", async function(event) {

    event.preventDefault();


    const employeeData = {

        Emp_Id: form.Emp_Id.value,

        Name: form.Name.value,

        Email: form.Email.value,

        Password: form.Password.value,

        Phone_No: form.Phone_No.value,

        City: form.City.value,

        Address: form.Address.value,

        Department: form.Department.value,

        Designation: form.Designation.value,

        Salary: form.Salary.value,

        Status: form.Status.value,

        Role: "User"

    };


    const csrftoken =
        document.querySelector("[name=csrfmiddlewaretoken]").value;

    const token =
        localStorage.getItem("access");


    try {

        const response = await fetch("/employees/add/", {

            method: "POST",

            headers: {

                "Content-Type": "application/json",

                "Authorization": `Bearer ${token}`,

                "X-CSRFToken": csrftoken

            },

            body: JSON.stringify(employeeData)

        });


        const result = await response.json();


        if (response.ok) {

            alert("Employee Added Successfully");

            form.reset();

            setTimeout(() => {

                window.location.href =
                    "/employees/view_employee_page/";

            }, 1000);

        }

        else {

            alert(JSON.stringify(result));

        }


    }

    catch(error) {

        alert("Something went wrong");

        console.log(error);

    }

});

</script>

{% endblock %}
