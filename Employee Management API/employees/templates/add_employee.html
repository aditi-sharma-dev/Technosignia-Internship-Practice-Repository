<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Employee</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet"
     href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

<style>
    <style>
        
        body{
           background: linear-gradient(135deg,#e3f2fd,#f8f9fa);
           min-height:100vh;
            font-family:Arial,sans-serif;
         }
      

    .card{
    border:none;
    border-radius:20px;
    margin-top:20px;
}

        textarea{
            resize: none;
        }
        .sidebar{
    background:#173d63;
    min-height:100vh;
}

.sidebar .nav-link{
    color:white;
    padding:12px 15px;
    border-radius:12px;
    margin-bottom:10px;
    transition:.3s;
}

.sidebar .nav-link:hover{
    background:#2c5f94;
}

.sidebar .active{
    background:#0d6efd;
}
    </style>
</head>

<body>


<div class="container-fluid">
        <div class="row">
            <div class="col-lg-2 col-md-4 sidebar text-white p-4">
                <h3 class="fw-bold text-center mb-4">
                    <i class="bi bi-buildings-fill"></i>
                    EMS
                </h3>
                <hr>
                <ul class="nav flex-column">
                    <li class="nav-item">
                       <a href="{% url 'dashboard' %}" class="nav-link">
                          <i class="bi bi-speedometer2 me-2"></i>
                          Dashboard
                       </a>

                    </li>
                    <li class="nav-item">
                        <a href="{% url 'add_employee_page' %}" class="nav-link active">
                     <i class="bi bi-person-plus-fill me-2"></i>
                    Add Employee
                     </a>
                    </li>
                    <li class="nav-item">
                        <a href="{% url 'view_employee_page' %}" class="nav-link ">
                            <i class="bi bi-people-fill me-2"></i>
              View Employees</a>
                    </li>
                    <li class="nav-item">
                        <a href="{% url 'view_profile' %}" class="nav-link ">
                       <i class="bi bi-people-fill me-2"></i>
                        Profile
                    </a>
                    </li>
                    <li class="nav-item mt-5">
                        <a href="#" id="logoutBtn" class="nav-link text-warning">
                            <i class="bi bi-box-arrow-right me-2"></i>
                            Logout
                        </a>
                    </li>
                </ul>
            </div>
           
            <div class="col-lg-10 col-md-8">
                <div class="d-flex justify-content-between align-items-center bg-white shadow-sm px-4 py-3">
                    <div>
        <h2 class="fw-bold mb-0">Add Employee</h2>
        <p class="text-primary fw-semibold mb-0 mt-1">
            Employee Management System
        </p>
    </div>
</div>
           <div class="card shadow-lg p-4 mt-4">
                <form id="AddEmployeeForm">

                    {% csrf_token %}

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label fw-semibold">Employee ID</label>
                            <input type="number"
                            class="form-control"
                            name="Emp_Id"
                            placeholder="Enter Employee ID"
                           required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label fw-semibold">Name</label>
                            <input type="text"
                                   class="form-control"
                                   name="Name"
                                   placeholder="Enter employee name"
                                   required>
                        </div>

                        <div class="col-md-6 mb-3">
                            <label class="form-label fw-semibold">Email</label>
                            <input type="email"
                                   class="form-control"
                                   name="Email"
                                   placeholder="Enter email address"
                                   required>
                        </div>

                        <div class="col-md-6 mb-3">
                            <label class="form-label fw-semibold">Phone Number</label>
                            <input type="text"
                                   class="form-control"
                                   name="Phone_No"
                                   placeholder="Enter phone number"
                                   required>
                        </div>

                        <div class="col-md-6 mb-3">
                            <label class="form-label fw-semibold">City</label>
                            <input type="text"
                                   class="form-control"
                                   name="City"
                                   placeholder="Enter city"
                                   required>
                        </div>
                          <div class="col-md-6 mb-3">
                            <label class="form-label fw-semibold">Address</label>
                            <textarea class="form-control"
                                      rows="2"
                                      name="Address"
                                      placeholder="Enter address"
                                      required></textarea>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label fw-semibold">Department</label>
                            <input type="text"
                                   class="form-control"
                                   name="Department"
                                   placeholder="Enter department"
                                   required>
                        </div>

                        <div class="col-md-6 mb-3">
                            <label class="form-label fw-semibold">Designation</label>
                            <input type="text"
                                   class="form-control"
                                   name="Designation"
                                   placeholder="Enter designation"
                                   required>
                        </div>

                        <div class="col-md-6 mb-3">
                            <label class="form-label fw-semibold">Salary</label>
                            <input type="number"
                                   class="form-control"
                                   name="Salary"
                                   placeholder="Enter salary"
                                   required>
                        </div>
                        <div class="col-md-6 mb-3">
    <label class="form-label fw-semibold">Password</label>
    <input type="password"
           class="form-control"
           name="Password"
           placeholder="Enter Password"
           required>
</div>


                

                    </div>

                    <button type="submit"
                            class="btn btn-primary  w-100 py-2">
                        Add Employee
                    </button>

                   

                </form>
</div>
            </div>

        </div>

    </div>

</div>

<script>

const form=document.getElementById("AddEmployeeForm");

form.addEventListener("submit",async function(event){

event.preventDefault();

const employeeData = {
    Emp_Id: form.Emp_Id.value,
    Name: form.Name.value,
    Email: form.Email.value,
    Password: form.Password.value,
    Phone_No: form.Phone_No.value,
    City: form.City.value,
    Address: form.Address.value,
    Department: form.Department.value,
    Designation: form.Designation.value,
    Salary: form.Salary.value,
    Role: "User"
};

const csrftoken = document.querySelector("[name=csrfmiddlewaretoken]").value;
const token = localStorage.getItem("access");
try{
const response = await fetch("/employees/add/", {

    method: "POST",

    headers: {
        "Content-Type": "application/json",
        "Authorization": `Bearer ${token}`,
        "X-CSRFToken": csrftoken
    },

    body: JSON.stringify(employeeData)

});


const result=await response.json();

if(response.ok){

alert("Employee Added Successfully");

form.reset();
setTimeout(() => {
    window.location.href = "/employees/view_employee_page/";
}, 1000);

}else{

alert(JSON.stringify(result));

}

}catch(error){

alert("Something went wrong");

console.log(error);

}

});

</script>

</body>
</html>
