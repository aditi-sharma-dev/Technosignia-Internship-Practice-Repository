{% extends "base.html" %}

{% block title %}Update Profile{% endblock %}

{% block content %}

<!-- HEADER -->

<div class="bg-white shadow-sm px-4 py-3">

    <h2 class="fw-bold mb-1">
        Update Profile
    </h2>

    <p class="text-primary small mb-0">
        Employee Management System
    </p>

</div>


<!-- PROFILE CARD -->

<div class="card shadow-lg p-4 mt-3">

    <!-- PROFILE PHOTO -->

    <div class="text-center mb-4">

        <img id="profilePhoto"
             src="/static/images/default.jpg"
             class="rounded-circle border border-3 border-primary shadow"
             width="150"
             height="150">

        <div class="mt-3">

            <input type="file"
                   id="profilePhotoInput"
                   class="form-control">

        </div>


        <h3 id="displayName"
            class="fw-bold mt-3">
        </h3>


        <span class="badge bg-primary"
              id="role">
        </span>

    </div>


    <hr>


    <!-- FORM -->

    <div class="row">

        <!-- NAME -->

        <div class="col-md-6 mb-3">

            <label class="fw-bold">
                Name
            </label>

            <input type="text"
                   id="name"
                   class="form-control">

        </div>


        <!-- EMAIL -->

        <div class="col-md-6 mb-3">

            <label class="fw-bold">
                Email
            </label>

            <input type="email"
                   id="email"
                   class="form-control">

        </div>

    </div>


    <hr>


    <!-- BUTTONS -->

    <div class="text-center mt-3">

        <button class="btn btn-success px-4 me-2"
                onclick="updateProfile()">

            <i class="bi bi-check-circle me-2"></i>

            Save Changes

        </button>


        <a href="/employees/profile-page/"
           class="btn btn-outline-secondary px-4">

            <i class="bi bi-arrow-left me-2"></i>

            Cancel

        </a>

    </div>

</div>

{% endblock %}



{% block extra_css %}

<style>

.card{
    border:none;
    border-radius:20px;
}

.form-control{
    border-radius:10px;
}

.form-control:focus{
    box-shadow:none;
    border-color:#0d6efd;
}

#profilePhoto{
    object-fit:cover;
}

label{
    margin-bottom:5px;
}

</style>

{% endblock %}



{% block extra_js %}

<script>

/* =========================
   LOAD PROFILE
========================= */

const token = localStorage.getItem("access");


fetch("/employees/profile/", {

    method: "GET",

    headers: {

        Authorization: `Bearer ${token}`

    }

})

.then(response => response.json())

.then(data => {


    /* PROFILE PHOTO */

    if(data.Profile_Photo){

        document.getElementById(
            "profilePhoto"
        ).src = data.Profile_Photo;

    }else{

        document.getElementById(
            "profilePhoto"
        ).src = "/static/images/default.jpg";

    }


    /* NAME */

    document.getElementById(
        "displayName"
    ).innerText = data.Name;


    document.getElementById(
        "name"
    ).value = data.Name;


    /* EMAIL */

    document.getElementById(
        "email"
    ).value = data.Email;


    /* ROLE */

    document.getElementById(
        "role"
    ).innerText = "Administrator";

})

.catch(error => {

    console.error(error);

    alert("Failed to load profile.");

});



/* =========================
   PROFILE PHOTO PREVIEW
========================= */

document
.getElementById("profilePhotoInput")
.addEventListener("change", function(){

    const file = this.files[0];


    if(file){

        document.getElementById(
            "profilePhoto"
        ).src = URL.createObjectURL(file);

    }

});



/* =========================
   UPDATE PROFILE
========================= */

function updateProfile(){

    const token =
        localStorage.getItem("access");


    const formData =
        new FormData();


    /* NAME */

    formData.append(
        "Name",
        document.getElementById("name").value
    );


    /* EMAIL */

    formData.append(
        "Email",
        document.getElementById("email").value
    );


    /* PROFILE PHOTO */

    const photo =
        document.getElementById(
            "profilePhotoInput"
        ).files[0];


    if(photo){

        formData.append(
            "Profile_Photo",
            photo
        );

    }


    /* API CALL */

    fetch("/employees/update-profile/", {

        method: "PUT",

        headers: {

            Authorization:
                `Bearer ${token}`

        },

        body: formData

    })

    .then(response => {

        if(!response.ok){

            throw new Error(
                "Update Failed"
            );

        }

        return response.json();

    })

    .then(data => {

        alert(
            "Profile Updated Successfully"
        );


        window.location.href =
            "/employees/profile-page/";

    })

    .catch(error => {

        console.log(error);

        alert(
            "Update Failed"
        );

    });

}

</script>

{% endblock %}
