<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Update Profile</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
      <style>
      body{
       background:#eef5fb;
       font-family:Arial,sans-serif;
     }

   .sidebar{
       background:#173d63;
       min-height:100vh;
     }

    .sidebar .nav-link{
       color:white;
       padding:12px 15px;
       border-radius:12px;
       margin-bottom:10px;
       transition:.3s;
     }

   .sidebar .nav-link:hover{
      background:#2c5f94;
     }

   .sidebar .active{
      background:#0d6efd;
    }
    .card{
    border: none;
    border-radius: 20px;
}


.form-control{
    border-radius:10px;
}

.form-control:focus{
    box-shadow:none;
    border-color:#0d6efd;
}

#profilePhoto{
    object-fit:cover;
}

label{
    margin-bottom:5px;
}
</style>
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <div class="col-lg-2 col-md-4 sidebar text-white p-4">
                <h3 class="fw-bold text-center mb-4">
                    <i class="bi bi-buildings-fill"></i>
                    EMS
                </h3>
                <hr>
                <ul class="nav flex-column">
                    <li class="nav-item">
                        <a href="{% url 'dashboard' %}" class="nav-link ">
                            <i class="bi bi-speedometer2 me-2"></i>
                            Dashboard
                        </a>

                    </li>
                    <li class="nav-item">
                        <a href="{% url 'add_employee_page' %}" class="nav-link">
                            <i class="bi bi-person-plus-fill me-2"></i>
                            Add Employee
                        </a>
                    </li>
                    <li class="nav-item">
                        <a href="{% url 'view_employee_page' %}" class="nav-link">
                            <i class="bi bi-people-fill me-2"></i>
                            View Employees
                        </a>
                    </li>
                    
                  
                       
                    <li class="nav-item mt-5">
                        <a href="#" id="logoutBtn" class="nav-link text-warning">
                            <i class="bi bi-box-arrow-right me-2"></i>
                            Logout
                        </a>
                    </li>
                </ul>
            </div>
            <div class="col-lg-10 col-md-8">

    <!-- Header -->
    <div class="bg-white shadow-sm px-4 py-3">
        <h2 class="fw-bold mb-1">Update Profile</h2>
        <p class="text-primary small mb-0">
            Employee Management System
        </p>
    </div>



 <div class="card shadow-lg p-4 mt-3">
            <div class="text-center mb-4">
                <img id="profilePhoto" src="/static/images/default.jpg" class="rounded-circle border border-3" width="150" height="150">
                <div class="mt-3">
    <input type="file" id="profilePhotoInput" class="form-control">
</div>

<h3 id="displayName"></h3>

<span class="badge bg-primary" id="role"></span>
</div>        
                
            <hr>
   
                 
                <div class="row">

    <div class="col-md-6 mb-3">
        <label class="fw-bold">Name</label>
        <input type="text" id="name" class="form-control">
    </div>

    <div class="col-md-6 mb-3">
        <label class="fw-bold">Email</label>
        <input type="email" id="email" class="form-control">
    </div>

</div>
               
            </div>
            <hr>

<div class="text-center mt-3">

    <button class="btn btn-success px-4 me-2"
            onclick="updateProfile()">
        <i class="bi bi-check-circle me-2"></i>
        Save Changes
    </button>

    <a href="/employees/profile-page/"
       class="btn btn-outline-secondary px-4">
        <i class="bi bi-arrow-left me-2"></i>
        Cancel
    </a>

</div>
           
              


 </div>
</div>
</div>   

</div>   
</div>   

</div>  
    <script>
        const token=localStorage.getItem("access");
        fetch("/employees/profile/",{
            "method": "GET",
            "headers":{
                Authorization:`Bearer ${token}`
}  


})
        .then(response=>response.json())
        .then(data=>{
           if (data.Profile_Photo) {
    document.getElementById("profilePhoto").src = data.Profile_Photo;
} else {
    document.getElementById("profilePhoto").src = "/static/images/default.jpg";
}
document.getElementById("displayName").innerText = data.Name;
document.getElementById("name").value = data.Name;
document.getElementById("email").value = data.Email;
document.getElementById("role").innerText = "Administrator";

        })
    .catch(error => {
    console.error(error);
    alert("Failed to load profile.");
});
document.getElementById("profilePhotoInput").addEventListener("change", function () {

    const file = this.files[0];

    if (file) {
        document.getElementById("profilePhoto").src = URL.createObjectURL(file);
    }

});
function updateProfile() {

    const token = localStorage.getItem("access");

    const formData = new FormData();

   formData.append("Name", document.getElementById("name").value);
formData.append("Email", document.getElementById("email").value);

    const photo = document.getElementById("profilePhotoInput").files[0];

    if (photo) {
        formData.append("Profile_Photo", photo);
    }

    fetch("/employees/update-profile/", {
        method: "PUT",
        headers: {
            Authorization: `Bearer ${token}`
        },
        body: formData
    })
    .then(response => {
        if (!response.ok) {
            throw new Error("Update Failed");
        }
        return response.json();
    })
    .then(data => {
        alert("Profile Updated Successfully");
        window.location.href = "/employees/profile-page/";
    })
    .catch(error => {
        console.log(error);
        alert("Update Failed");
    });

}

        </script>
   
</body>
</html>
