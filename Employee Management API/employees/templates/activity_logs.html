
<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Activity Logs</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

<style>

body{
    background: linear-gradient(135deg,#e3f2fd,#f8f9fa);
    min-height:100vh;
    font-family:Arial,sans-serif;
}

.sidebar{
    background:#173d63;
    min-height:100vh;
}

.sidebar .nav-link{
    color:white;
    padding:12px 15px;
    border-radius:12px;
    margin-bottom:10px;
}

.sidebar .nav-link:hover{
    background:#2c5f94;
}

.sidebar .active{
    background:#0d6efd;
}

.table-responsive{
    border-radius:15px;
    overflow-x:auto;
    overflow-y:hidden;
}

.table{
    margin-bottom:0;
    font-size:13px;
}

.table th{
    text-align:center;
    vertical-align:middle;
    white-space:nowrap;
}

.table-header th{
    background-color:#0d6efd !important;
    color:white;
    text-align:center;
    vertical-align:middle;
}

.table td{
    text-align:center;
    vertical-align:middle;
}

.table tbody tr:hover{
    background:#f1f7ff;
    transition:0.3s;
}

.action-badge{
    padding:6px 10px;
    border-radius:7px;
    font-size:12px;
}

.back-link{
    text-decoration:none;
    font-weight:600;
}

.filter-label{
    font-size:13px;
    font-weight:600;
    margin-bottom:5px;
}

</style>

</head>

<body>

<div class="container-fluid">

<div class="row">


<!-- SIDEBAR -->

<div class="col-lg-2 col-md-4 sidebar text-white p-4">

    <h3 class="fw-bold text-center mb-4">

        <i class="bi bi-buildings-fill"></i>
        EMS

    </h3>

    <hr>

    <ul class="nav flex-column">

        <li class="nav-item">

            <a href="{% url 'dashboard' %}" class="nav-link">

                <i class="bi bi-speedometer2 me-2"></i>
                Dashboard

            </a>

        </li>


        <li class="nav-item">

            <a href="{% url 'add_employee_page' %}" class="nav-link">

                <i class="bi bi-person-plus-fill me-2"></i>
                Add Employee

            </a>

        </li>


        <li class="nav-item">

            <a href="{% url 'view_employee_page' %}" class="nav-link">

                <i class="bi bi-people-fill me-2"></i>
                View Employees

            </a>

        </li>


        <li class="nav-item">

            <a href="{% url 'profile_page' %}" class="nav-link">

                <i class="bi bi-person-circle me-2"></i>
                Profile

            </a>

        </li>


        <!-- ACTIVITY LOGS -->

        <li class="nav-item">

            <a href="{% url 'activity_logs_page' %}"
               class="nav-link active">

                <i class="bi bi-clock-history me-2"></i>
                Activity Logs

            </a>

        </li>


        <li class="nav-item mt-5">

            <a href="#"
               id="logoutBtn"
               class="nav-link text-warning">

                <i class="bi bi-box-arrow-right me-2"></i>
                Logout

            </a>

        </li>

    </ul>

</div>



<!-- MAIN CONTENT -->

<div class="col-lg-10 col-md-8">


    <!-- HEADER -->

    <div class="d-flex justify-content-between align-items-center bg-white shadow-sm px-4 py-3">

        <div>

            <h2 class="fw-bold mb-0">
                Activity Logs
            </h2>

            <p class="text-primary fw-semibold mb-0 mt-1">
                Employee Management System
            </p>

        </div>

    </div>



    <!-- CONTENT -->

    <div class="container-fluid mt-4">

        <div class="bg-white shadow-sm p-4 rounded-4">


            <!-- TITLE + REFRESH -->

            <div class="d-flex justify-content-between align-items-center mb-4">

                <h5 class="fw-bold mb-0">

                    <i class="bi bi-clock-history text-primary me-2"></i>
                    Activity

                </h5>

                 <div>
    <button class="btn btn-outline-primary me-2"
            onclick="loadActivityLogs()">

        <i class="bi bi-arrow-clockwise me-1"></i>
        Refresh

    </button>

    <button class="btn btn-success"
            onclick="exportActivityLogs()">

        <i class="bi bi-download me-1"></i>
        Export CSV

    </button>
</div>
                

            </div>



            <!-- FILTERS -->

            <div class="row g-3 mb-4">


                <!-- SEARCH -->

                <div class="col-lg-4 col-md-6">

                    <label class="filter-label">
                        Search
                    </label>

                    <div class="input-group">

                        <span class="input-group-text">

                            <i class="bi bi-search"></i>

                        </span>

                        <input type="text"
                               id="searchInput"
                               class="form-control"
                               placeholder="Search user or description">

                    </div>

                </div>



                <!-- ACTION -->

                <div class="col-lg-2 col-md-6">

                    <label class="filter-label">
                        Action
                    </label>

                    <select id="actionFilter"
                            class="form-select">

                        <option value="">All</option>

                        <option value="Registration">
                            Registration
                        </option>

                        <option value="Login">
                            Login
                        </option>

                        <option value="Logout">
                            Logout
                        </option>

                        <option value="Create">
                            Create
                        </option>

                        <option value="Update">
                            Update
                        </option>

                        <option value="Delete">
                            Delete
                        </option>

                        <option value="Password Change">
                            Password Change
                        </option>

                    </select>

                </div>



                <!-- ROLE -->

                <div class="col-lg-2 col-md-6">

                    <label class="filter-label">
                        Role
                    </label>

                    <select id="roleFilter"
                            class="form-select">

                        <option value="">All</option>

                        <option value="Admin">
                            Admin
                        </option>

                        <option value="User">
                            User
                        </option>

                    </select>

                </div>



                <!-- DATE -->

                <div class="col-lg-2 col-md-6">

                    <label class="filter-label">
                        Date
                    </label>

                    <input type="date"
                           id="dateFilter"
                           class="form-control">

                </div>



                <!-- APPLY -->

                <div class="col-lg-2 col-md-6 d-flex align-items-end">

                    <button class="btn btn-primary w-100"
                            onclick="loadActivityLogs()">

                        <i class="bi bi-funnel me-1"></i>
                        Apply

                    </button>

                </div>

            </div>



            <!-- CLEAR FILTER -->

            <div class="mb-3">

                <button class="btn btn-sm btn-outline-secondary"
                        onclick="clearFilters()">

                    <i class="bi bi-x-circle me-1"></i>
                    Clear Filters

                </button>

            </div>



            <!-- TABLE -->

            <div class="table-responsive">

                <table class="table table-bordered table-hover text-nowrap">

                    <thead class="table-header">

                        <tr>

                            <th>ID</th>

                            <th>User</th>

                            <th>Role</th>

                            <th>Action</th>

                            <th>Description</th>

                            <th>IP Address</th>

                            <th>Date & Time</th>

                        </tr>

                    </thead>


                    <tbody id="activityTable">

                    </tbody>

                </table>
                 <div class="d-flex justify-content-center mt-4">
                    <ul class="pagination" id="pagination"></ul>
                </div>
            </div>

        </div>



        <p class="text-center mt-4">

            <a href="{% url 'dashboard' %}"
               class="back-link">

                ← Back to Dashboard

            </a>

        </p>

    </div>

</div>

</div>

</div>



<script>


/* LOAD ACTIVITY LOGS */
async function loadActivityLogs(page = 1){

    try{

        const token =
            localStorage.getItem("access");


        if(!token){

            alert("Session expired. Please login again.");

            window.location.href =
                "/employees/login-page/";

            return;
        }


        // GET FILTER VALUES

        const search =
            document.getElementById("searchInput")
            .value
            .trim();


        const action =
            document.getElementById("actionFilter")
            .value;


        const role =
            document.getElementById("roleFilter")
            .value;


        const date =
            document.getElementById("dateFilter")
            .value;


        // CREATE QUERY PARAMETERS

        const params =
            new URLSearchParams();


        if(search){
            params.append("search", search);
        }


        if(action){
            params.append("action", action);
        }


        if(role){
            params.append("role", role);
        }


        if(date){
            params.append("date", date);
        }


        // PAGINATION

        params.append("page", page);


        // API URL

        let url =
            "/employees/activity-logs/?" +
            params.toString();


        // API CALL

        const response =
            await fetch(
                url,
                {
                    headers:{
                        "Authorization":
                        `Bearer ${token}`
                    }
                }
            );


        const logs =
            await response.json();


        const table =
            document.getElementById("activityTable");


        table.innerHTML = "";


        // API ERROR

        if(!response.ok){

            table.innerHTML = `

                <tr>

                    <td colspan="7"
                        class="text-center text-danger">

                        ${logs.message ||
                        "Unable to fetch activity logs"}

                    </td>

                </tr>

            `;

            document.getElementById("pagination").innerHTML = "";

            return;
        }


        // PAGINATED RESULTS

        const results =
            logs.results;


        // NO LOGS

        if(results.length === 0){

            table.innerHTML = `

                <tr>

                    <td colspan="7"
                        class="text-center text-muted">

                        No Activity Logs Found

                    </td>

                </tr>

            `;

            document.getElementById("pagination").innerHTML = "";

            return;
        }


        // DISPLAY LOGS

        results.forEach(log => {

            table.innerHTML += `

                <tr>

                    <td>
                        ${log.user_id || "-"}
                    </td>

                    <td>
                        ${log.user || "-"}
                    </td>

                    <td>
                        ${log.role || "-"}
                    </td>

                    <td>
                        ${log.action || "-"}
                    </td>

                    <td>
                        ${log.description || "-"}
                    </td>

                    <td>
                        ${log.ip_address || "-"}
                    </td>

                    <td>
                        ${formatDate(log.timestamp)}
                    </td>

                </tr>

            `;

        });


        // CREATE PAGINATION

        createPagination(logs,page);
        


    }


    catch(error){

        console.log(error);


        document.getElementById("activityTable").innerHTML = `

            <tr>

                <td colspan="7"
                    class="text-center text-danger">

                    Something went wrong while loading activity logs.

                </td>

            </tr>

        `;

    }

}
function createPagination(logs, currentPage){

    const pagination =
        document.getElementById("pagination");

    pagination.innerHTML = "";

    // Previous Button
    if(logs.previous){

        pagination.innerHTML += `
            <li class="page-item">
                <button
                    class="page-link"
                    onclick="loadActivityLogs(${currentPage - 1})">
                    Previous
                </button>
            </li>
        `;
    }

    // Total Pages
    const totalPages =
        Math.ceil(logs.count / 10);

    // Page Numbers
    for(let i = 1; i <= totalPages; i++){

        pagination.innerHTML += `
            <li class="page-item ${i === currentPage ? "active" : ""}">

                <button
                    class="page-link"
                    onclick="loadActivityLogs(${i})">

                    ${i}

                </button>

            </li>
        `;
    }

    // Next Button
    if(logs.next){

        pagination.innerHTML += `
            <li class="page-item">

                <button
                    class="page-link"
                    onclick="loadActivityLogs(${currentPage + 1})">

                    Next

                </button>

            </li>
        `;
    }
}

function formatDate(timestamp){

    if(!timestamp){
        return "-";
    }

    const date = new Date(timestamp);

    return date.toLocaleString();
}

async function exportActivityLogs(){

    const token = localStorage.getItem("access");

    if(!token){
        alert("Session expired. Please login again.");
        window.location.href = "/employees/login-page/";
        return;
    }

    const search =
        document.getElementById("searchInput").value.trim();

    const action =
        document.getElementById("actionFilter").value;

    const role =
        document.getElementById("roleFilter").value;

    const date =
        document.getElementById("dateFilter").value;

    const params = new URLSearchParams();

    if(search){
        params.append("search", search);
    }

    if(action){
        params.append("action", action);
    }

    if(role){
        params.append("role", role);
    }

    if(date){
        params.append("date", date);
    }

    const url =
        "/employees/export-activity-logs/?" +
        params.toString();

    const response = await fetch(url, {
        headers: {
            "Authorization": `Bearer ${token}`
        }
    });

    if(!response.ok){
        const error = await response.json();
        alert(error.message || "Unable to export activity logs");
        return;
    }

    const blob = await response.blob();

    const downloadUrl =
        window.URL.createObjectURL(blob);

    const a = document.createElement("a");

    a.href = downloadUrl;
    a.download = "activity_logs.csv";

    document.body.appendChild(a);

    a.click();

    a.remove();

    window.URL.revokeObjectURL(downloadUrl);
}
function clearFilters(){

    document.getElementById("searchInput").value = "";

    document.getElementById("actionFilter").value = "";

    document.getElementById("roleFilter").value = "";

    document.getElementById("dateFilter").value = "";

    loadActivityLogs(1);
}


loadActivityLogs(1);


</script>


</body>

</html>
