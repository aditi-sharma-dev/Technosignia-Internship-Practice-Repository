{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>
        {% block title %}
            Employee Management System
        {% endblock %}
    </title>


    <!-- Bootstrap -->

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >


    <!-- Bootstrap Icons -->

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    >


    <style>

        /* =========================================
           BODY
        ========================================= */

        body {

            background: #eef5fb;

            font-family: Arial, sans-serif;

            margin: 0;

        }


        /* =========================================
           SIDEBAR
        ========================================= */

        .sidebar {

            background: #173d63;

            min-height: 100vh;

        }


        .sidebar .nav-link {

            color: white;

            padding: 12px 15px;

            border-radius: 12px;

            margin-bottom: 10px;

            transition: .3s;

        }


        .sidebar .nav-link:hover {

            background: #2c5f94;

        }


        .sidebar .nav-link.active {

            background: #0d6efd;

        }


        /* =========================================
           CARDS
        ========================================= */

        .dashboard-card {

            border: none;

            border-radius: 18px;

        }


        .top-card {

            border: none;

            border-radius: 18px;

            background:
                linear-gradient(
                    135deg,
                    #1d4f80,
                    #4f8fc9
                );

            color: white;

        }


        .quick-card {

            border: none;

            border-radius: 15px;

        }


        .card {

            border: none;

            border-radius: 20px;

        }


        /* =========================================
           RESPONSIVE
        ========================================= */

        @media (max-width: 991px) {

            .sidebar {

                min-height: auto;

            }

        }

    </style>


    {% block extra_css %}
    {% endblock %}

</head>


<body>


<div class="container-fluid">

    <div class="row">


        <!-- ==================================================
             SIDEBAR
        ================================================== -->

        <div class="col-lg-2 col-md-4 sidebar text-white p-4">


            <!-- LOGO -->

            <h3 class="fw-bold text-center mb-4">

                <i class="bi bi-buildings-fill"></i>

                EMS

            </h3>


            <hr>


            <ul class="nav flex-column">


                <!-- ==================================================
                     DASHBOARD
                ================================================== -->

                <li class="nav-item">

                    <a
                        href="{% url 'user_dashboard' %}"
                        class="nav-link {% block dashboard_active %}{% endblock %}"
                    >

                        <i class="bi bi-speedometer2 me-2"></i>

                        Dashboard

                    </a>

                </li>



                <!-- ==================================================
                     MY PROFILE
                ================================================== -->

                <li class="nav-item">

                    <a
                        href="{% url 'user_profile_page' %}"
                        class="nav-link {% block profile_active %}{% endblock %}"
                    >

                        <i class="bi bi-person-circle me-2"></i>

                        My Profile

                    </a>

                </li>



                <!-- ==================================================
                     ACTIVITY LOGS
                ================================================== -->

                <li class="nav-item">

                    <a
                        href="{% url 'user_activity_logs_page' %}"
                        class="nav-link {% block logs_active %}{% endblock %}"
                    >

                        <i class="bi bi-clock-history me-2"></i>

                        Activity Logs

                    </a>

                </li>



                <!-- ==================================================
                     LOGOUT
                ================================================== -->

                <li class="nav-item mt-5">

                    <a
                        href="#"
                        id="logoutBtn"
                        class="nav-link text-warning"
                    >

                        <i class="bi bi-box-arrow-right me-2"></i>

                        Logout

                    </a>

                </li>

            </ul>

        </div>



        <!-- ==================================================
             MAIN CONTENT
        ================================================== -->

        <div class="col-lg-10 col-md-8">


            {% block content %}

            {% endblock %}


        </div>

    </div>

</div>



<!-- ==========================================================
     COMMON JAVASCRIPT
========================================================== -->

<script>


/* ==========================================================
   CHECK LOGIN
========================================================== */

async function checkLogin() {


    const token =
        localStorage.getItem("access");


    /* -----------------------------------------
       TOKEN NOT FOUND
    ----------------------------------------- */

    if (!token) {

        alert(
            "Session Expired. Please Login Again."
        );


        window.location.href =
            "/employees/login-page/";


        return false;

    }


    try {


        /* -----------------------------------------
           CHECK PROTECTED API
        ----------------------------------------- */

        const response =
            await fetch(
                "/employees/protected/",
                {

                    method: "GET",

                    headers: {

                        "Authorization":
                            `Bearer ${token}`

                    }

                }
            );



        /* -----------------------------------------
           TOKEN INVALID
        ----------------------------------------- */

        if (!response.ok) {


            localStorage.removeItem(
                "access"
            );


            localStorage.removeItem(
                "refresh"
            );


            alert(
                "Session Expired. Please Login Again."
            );


            window.location.href =
                "/employees/login-page/";


            return false;

        }


        return true;

    }


    catch (error) {


        console.error(
            "Login Check Error:",
            error
        );


        return false;

    }

}


/* ==========================================================
   LOGOUT
========================================================== */

async function logoutUser() {

    const confirmLogout = confirm(
        "Are you sure you want to logout?"
    );

    if (!confirmLogout) {
        return;
    }


    const access = localStorage.getItem("access");


    if (!access) {

        localStorage.removeItem("access");
        localStorage.removeItem("refresh");

        window.location.href =
            "/employees/login-page/";

        return;

    }


    try {

        const response = await fetch(
            "/employees/logout/",
            {
                method: "POST",

                headers: {
                    "Authorization": `Bearer ${access}`,
                    "Content-Type": "application/json"
                }
            }
        );


        /*
        -----------------------------------------
        CLEAR TOKENS
        -----------------------------------------
        */

        localStorage.removeItem("access");
        localStorage.removeItem("refresh");


        /*
        -----------------------------------------
        LOGOUT MESSAGE
        -----------------------------------------
        */

        if (response.ok) {

            alert("Logout Successful");

        }

        else {

            alert("Logged out successfully.");

        }


        /*
        -----------------------------------------
        LOGIN PAGE
        -----------------------------------------
        */

        window.location.href =
            "/employees/login-page/";

    }


    catch (error) {

        console.error(
            "Logout Error:",
            error
        );


        localStorage.removeItem("access");
        localStorage.removeItem("refresh");


        alert("Logged out successfully.");


        window.location.href =
            "/employees/login-page/";

    }

}



/* ==========================================================
   LOGOUT BUTTON EVENT
========================================================== */

const logoutBtn =
    document.getElementById("logoutBtn");


if (logoutBtn) {

    logoutBtn.addEventListener(
        "click",
        function(event) {

            event.preventDefault();

            logoutUser();

        }
    );

}

/* ==========================================================
   PAGE INITIALIZATION
========================================================== */

async function initializeUserPage() {


    await checkLogin();

}


initializeUserPage();

</script>



<!-- ==========================================================
     PAGE SPECIFIC JAVASCRIPT
========================================================== -->

{% block extra_js %}

{% endblock %}


</body>

</html>
