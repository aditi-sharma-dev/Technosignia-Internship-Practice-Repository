{% extends "base.html" %}

{% block title %}Update Employee{% endblock %}

{% block content %}

<div class="d-flex justify-content-between align-items-center bg-white shadow-sm px-4 py-3">

    <div>
        <h2 class="fw-bold mb-0">Update Employee</h2>

        <p class="text-primary fw-semibold mb-0 mt-1">
            Employee Management System
        </p>
    </div>

</div>


<div class="card shadow-lg p-4 mt-4">

    <form id="UpdateEmployeeForm">

        {% csrf_token %}

        <div class="row">

            <!-- EMPLOYEE ID -->
            <div class="col-md-6 mb-3">

                <label class="form-label fw-semibold">
                    Employee ID
                </label>

                <input type="number"
                       class="form-control"
                       name="Emp_Id"
                       value="{{ employee.Emp_Id }}"
                       placeholder="Enter Employee ID"
                       required>

            </div>


            <!-- NAME -->
            <div class="col-md-6 mb-3">

                <label class="form-label fw-semibold">
                    Name
                </label>

                <input type="text"
                       class="form-control"
                       name="Name"
                       value="{{ employee.Name }}"
                       placeholder="Enter employee name"
                       required>

            </div>


            <!-- EMAIL -->
            <div class="col-md-6 mb-3">

                <label class="form-label fw-semibold">
                    Email
                </label>

                <input type="email"
                       class="form-control"
                       name="Email"
                       value="{{ employee.Email }}"
                       placeholder="Enter email address"
                       required>

            </div>


            <!-- PHONE -->
            <div class="col-md-6 mb-3">

                <label class="form-label fw-semibold">
                    Phone Number
                </label>

                <input type="text"
                       class="form-control"
                       name="Phone_No"
                       value="{{ employee.Phone_No }}"
                       placeholder="Enter phone number"
                       required>

            </div>


            <!-- CITY -->
            <div class="col-md-6 mb-3">

                <label class="form-label fw-semibold">
                    City
                </label>

                <input type="text"
                       class="form-control"
                       name="City"
                       value="{{ employee.City }}"
                       placeholder="Enter city"
                       required>

            </div>


            <!-- ADDRESS -->
            <div class="col-md-6 mb-3">

                <label class="form-label fw-semibold">
                    Address
                </label>

                <textarea class="form-control"
                          rows="2"
                          name="Address"
                          placeholder="Enter address"
                          required>{{ employee.Address }}</textarea>

            </div>


            <!-- DEPARTMENT -->
            <div class="col-md-6 mb-3">

                <label class="form-label fw-semibold">
                    Department
                </label>

                <input type="text"
                       class="form-control"
                       name="Department"
                       value="{{ employee.Department }}"
                       placeholder="Enter department"
                       required>

            </div>


            <!-- DESIGNATION -->
            <div class="col-md-6 mb-3">

                <label class="form-label fw-semibold">
                    Designation
                </label>

                <input type="text"
                       class="form-control"
                       name="Designation"
                       value="{{ employee.Designation }}"
                       placeholder="Enter designation"
                       required>

            </div>


            <!-- SALARY -->
            <div class="col-md-6 mb-3">

                <label class="form-label fw-semibold">
                    Salary
                </label>

                <input type="number"
                       class="form-control"
                       name="Salary"
                       value="{{ employee.Salary }}"
                       placeholder="Enter salary"
                       required>

            </div>
            <!-- STATUS -->

<div class="col-md-6 mb-3">

    <label class="form-label fw-semibold">
        Status
    </label>

    <select
        class="form-select"
        name="Status"
        required
    >

        <option value="Active"
            {% if employee.Status == "Active" %}selected{% endif %}>
            Active
        </option>

        <option value="Inactive"
            {% if employee.Status == "Inactive" %}selected{% endif %}>
            Inactive
        </option>

    </select>

</div>

            <!-- PASSWORD -->
            <div class="col-md-6 mb-3">

                <label class="form-label fw-semibold">
                    Password
                </label>

                <input type="password"
                       class="form-control"
                       name="Password"
                       placeholder="Enter Password"
                       required>

            </div>

        </div>


        <!-- UPDATE BUTTON -->
        <button type="submit"
                class="btn btn-primary btn-lg w-100 py-2">

            Update Employee

        </button>

    </form>

</div>

{% endblock %}


{% block extra_js %}

<script>

const form = document.getElementById("UpdateEmployeeForm");


const employeeId = window.location.pathname
    .split("/")
    .filter(Boolean)
    .pop();


form.addEventListener("submit", async function(event){

    event.preventDefault();


    const employeeData = {

        Emp_Id: form.Emp_Id.value,

        Name: form.Name.value,

        Email: form.Email.value,

        Phone_No: form.Phone_No.value,

        City: form.City.value,

        Address: form.Address.value,

        Department: form.Department.value,

        Designation: form.Designation.value,

        Salary: form.Salary.value,
    
        Status: form.Status.value,
        
        Password: form.Password.value

    };


    const csrftoken =
        document.querySelector(
            "[name=csrfmiddlewaretoken]"
        ).value;


    const token =
        localStorage.getItem("access");


    try{

        const response = await fetch(
            `/employees/update/${employeeId}/`,
            {

                method: "PUT",

                headers: {

                    "Content-Type":
                        "application/json",

                    "Authorization":
                        `Bearer ${token}`,

                    "X-CSRFToken":
                        csrftoken

                },

                body:
                    JSON.stringify(employeeData)

            }
        );


        const result =
            await response.json();


        if(response.ok){

            alert(
                "Employee Updated Successfully"
            );


            setTimeout(() => {

                window.location.href =
                    "/employees/view_employee_page/";

            }, 1000);


        }else{

            alert(
                JSON.stringify(result)
            );

        }


    }catch(error){

        alert(
            "Something went wrong"
        );

        console.log(error);

    }

});

</script>

{% endblock %}
