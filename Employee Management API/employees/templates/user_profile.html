<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
      <style>
      body{
       background:#eef5fb;
       font-family:Arial,sans-serif;
     }

   .sidebar{
       background:#173d63;
       min-height:100vh;
     }

    .sidebar .nav-link{
       color:white;
       padding:12px 15px;
       border-radius:12px;
       margin-bottom:10px;
       transition:.3s;
     }

   .sidebar .nav-link:hover{
      background:#2c5f94;
     }

   .sidebar .active{
      background:#0d6efd;
    }
    .card{
    border: none;
    border-radius: 20px;
}
</style>
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <div class="col-lg-2 col-md-4 sidebar text-white p-4">
                <h3 class="fw-bold text-center mb-4">
                    <i class="bi bi-buildings-fill"></i>
                    EMS
                </h3>
                <hr>
                <ul class="nav flex-column">
                    <li class="nav-item">
                        <a href="{% url 'user_dashboard' %}" class="nav-link ">
                            <i class="bi bi-speedometer2 me-2"></i>
                            Dashboard
                        </a>

                    </li>
                
                
                    <li class="nav-item">
                        <a href="{% url 'user_profile_page' %}" class="nav-link active">
                       <i class="bi bi-person-circle me-2"></i>
                        My Profile
                    </a>
                    </li>
                       
                    <li class="nav-item mt-5">
                        <a href="#" id="logoutBtn" class="nav-link text-warning">
                            <i class="bi bi-box-arrow-right me-2"></i>
                            Logout
                        </a>
                    </li>
                </ul>
            </div>
    <div class="col-lg-10 col-md-8">
        
        <div class="d-flex justify-content-between align-items-center  bg-white shadow-sm px-4 py-3">
            <div>
                <h2 class="fw-bold mb-0">Profile</h2>
                <p class="text-primary fw-semibold mb-0 mt-1">Employee Management System</p>
            </div>
        </div>
        <div class="card shadow-lg p-4 mt-4">
            <div class="text-center mb-4">
                <img id="profilePhoto" src="/static/images/default.jpg" class="rounded-circle border border-3" width="150" height="150">
                <h3 class="fw-bold mt-3" id="name"></h3>
                <span class="badge bg-primary px-3 py-2" id="role"></span>
            </div>
            <hr>
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="fw-bold">Employee Id</label>
                        <input type="text" id="Emp_Id" class="form-control" readonly>
                </div>
                 <div class="col-md-6 mb-3">
                    <label class="fw-bold">Email</label>
                        <input type="email" id="email" class="form-control" readonly>
                </div>
                 <div class="col-md-6 mb-3">
                    <label class="fw-bold">Phone</label>
                        <input type="text" id="phone" class="form-control" readonly>
                </div>
                 <div class="col-md-6 mb-3">
                    <label class="fw-bold">City</label>
                        <input type="text" id="city" class="form-control" readonly>
                </div>
                 <div class="col-md-6 mb-3">
                    <label class="fw-bold">Address</label>
                        <textarea  id="address"  rows="2" class="form-control" readonly></textarea>
                </div>
                 <div class="col-md-6 mb-3">
                    <label class="fw-bold">Department</label>
                        <input type="text" id="department" class="form-control" readonly>
                </div>
                 <div class="col-md-6 mb-3">
                    <label class="fw-bold">Designation</label>
                        <input type="text" id="designation" class="form-control" readonly>
                </div>
                 <div class="col-md-6 mb-3">
                    <label class="fw-bold">Salary</label>
                        <input type="text" id="salary" class="form-control" readonly>
                </div>
                 <div class="col-md-6 mb-3">
                    <label class="fw-bold">Status</label>
                        <input type="text" id="status" class="form-control" readonly>
                </div>
            </div>
            <div class="text-center mt-3">
                <a href="/employees/user-update-profile-page/" class="btn btn-primary px-4">
                    <i class="bi bi-pencil-square me-2"></i>
                    Update Profile
                </a>
                <a href="/employees/user-change-password-page/" class="btn btn-warning px-4 ms-2">
                    <i class="bi bi-key-fill me-2"></i>
                    Change Password
                </a>

</div>
 </div>
</div>

    <script>
        const token=localStorage.getItem("access");
        fetch("/employees/profile/",{
            "method": "GET",
            "headers":{
                Authorization:`Bearer ${token}`
}  


})
        .then(response=>response.json())
        .then(data=>{
            
            if (data.Profile_Photo) {
    document.getElementById("profilePhoto").src = data.Profile_Photo;
} else {
    document.getElementById("profilePhoto").src = "/static/images/default.jpg";
}
            
            document.getElementById("name").innerText=data.Name;
            document.getElementById("role").innerText=data.Role;
            document.getElementById("Emp_Id").value=data.Emp_Id;
            document.getElementById("email").value=data.Email;
            document.getElementById("phone").value=data.Phone_No;
            document.getElementById("city").value=data.City;
            document.getElementById("department").value=data.Department;
            document.getElementById("designation").value=data.Designation;
            document.getElementById("salary").value=data.Salary;
            document.getElementById("status").value=data.Status;
            document.getElementById("address").value=data.Address;

        })
    .catch(error => {
    console.error(error);
    alert("Failed to load profile.");
});
        </script>
   
</body>
</html>
